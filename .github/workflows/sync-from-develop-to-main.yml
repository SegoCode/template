name: Sync from develop to main

on:
  workflow_dispatch:
    inputs:
      release:
        description: Version to publish when the pull request is merged
        required: true
        default: minor
        type: choice
        options:
          - minor
          - major
          - none

concurrency:
  group: promote-develop-to-main

jobs:
  create_pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check and create labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create auto-sync --repo "${{ github.repository }}" --color C5DEF5 --force
          gh label create auto-tag --repo "${{ github.repository }}" --color BFDADC --force
          gh label create semver:major --repo "${{ github.repository }}" --color B60205 --force

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BODY="Promote the current develop branch to main.

          ## Release

          **Selected:** ${{ inputs.release }}

          - minor: create the next major.minor tag, or 1.0 if no tag exists.
          - major: increment the major version and reset minor to zero.
          - none: merge without creating a tag."

          PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --base main --head develop --state open --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER=$(gh pr create --repo "${{ github.repository }}" --base main --head develop \
              --title "chore: promote develop to main" \
              --body "$PR_BODY" | sed 's#.*/##')
          fi

          gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --body "$PR_BODY" --add-label auto-sync
          case "${{ inputs.release }}" in
            major)
              gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --add-label auto-tag --add-label semver:major
              ;;
            minor)
              gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --remove-label semver:major 2>/dev/null || true
              gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --add-label auto-tag
              ;;
            none)
              gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --remove-label auto-tag 2>/dev/null || true
              gh pr edit "$PR_NUMBER" --repo "${{ github.repository }}" --remove-label semver:major 2>/dev/null || true
              ;;
          esac

          gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json url --jq .url
